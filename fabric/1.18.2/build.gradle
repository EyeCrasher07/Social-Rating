plugins { id 'fabric-loom' version '1.13.6' }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }
repositories { mavenCentral() }
dependencies {
minecraft 'com.mojang:minecraft:1.18.2'
mappings loom.officialMojangMappings()
modImplementation 'net.fabricmc:fabric-loader:0.19.5'
}
dependencies { modImplementation 'net.fabricmc.fabric-api:fabric-api:0.77.0+1.18.2' }
loom.runs { server { runDir 'build/run/server'; programArg 'nogui' } }

version = '1.0.0'
group = 'dev.eyecrasher.socialrating'
base { archivesName = 'social-rating-fabric' }
tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach { archiveVersion = project.version.toString() + '+1.18.2' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
configurations.matching {
    it.name.endsWith('CompileClasspath') || it.name.endsWith('RuntimeClasspath') ||
        it.name in ['compileClasspath', 'runtimeClasspath']
}.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
}
jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest { attributes 'MixinConfigs': 'socialrating.mixins.json' }
    from(file('LICENSE')) { rename { 'LICENSE_social-rating.txt' } }
}

// Verify server data behavior against this Minecraft version's bundled libraries.
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}
tasks.named('compileTestJava', JavaCompile) {
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.release = 17
}
tasks.named('test') { enabled = false }
['RatingStore', 'ServerFiles', 'RatingFeatures'].each { suite ->
    tasks.register('verify' + suite, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'dev.eyecrasher.socialrating.' + suite + 'Test'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(17) }
    }
}
tasks.named('check') { dependsOn 'verifyRatingStore', 'verifyServerFiles', 'verifyRatingFeatures' }
