plugins { id 'java'; id 'net.minecraftforge.gradle' version '7.0.17' }

java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
minecraft {
runs {
    configureEach { mods { socialrating { source sourceSets.main } }; args '--mixin.config=socialrating.mixins.json' }
    register('server') { workingDir = layout.buildDirectory.dir('run/server'); args '--nogui' }
} }
repositories { minecraft.mavenizer(it); maven fg.forgeMaven; maven fg.minecraftLibsMaven; mavenCentral() }
dependencies { implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.0.12') }

version = '1.0.0'
group = 'dev.eyecrasher.socialrating'
base { archivesName = 'social-rating-forge' }
tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach { archiveVersion = project.version.toString() + '+26.3' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
configurations.matching {
    it.name.endsWith('CompileClasspath') || it.name.endsWith('RuntimeClasspath') ||
        it.name in ['compileClasspath', 'runtimeClasspath']
}.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
}
jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest { attributes 'MixinConfigs': 'socialrating.mixins.json' }
    from(file('LICENSE')) { rename { 'LICENSE_social-rating.txt' } }
}

// Isolated two-client verification; excluded from the distributable JAR.
tasks.named('processResources') { inputs.property 'socialRatingSmoke', project.hasProperty('smokeTest') }
tasks.withType(Jar).configureEach { exclude '**/RatingSmoke*.class' }
if (project.hasProperty('smokeTest')) {
    sourceSets {
        smoke {
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath
            resources.exclude 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml'
        }
    }
    def ratingRole = project.findProperty('smokeRole') ?: 'host'
    def ratingPort = project.findProperty('smokePort') ?: '25593'
    def ratingRun = file('run/smoke-pair/' + ratingRole)
    def ratingShared = file('run/smoke-pair').absolutePath
    tasks.named('compileSmokeJava', JavaCompile) { destinationDirectory = layout.buildDirectory.dir('classes/java/main') }
    sourceSets.smoke.output.classesDirs.setFrom(layout.buildDirectory.dir('classes/java/main'))
    minecraft.runs {
        configureEach { mods { socialrating { source sourceSets.smoke } } }
        register('client') {
            workingDir = ratingRun
            args '--username', ratingRole == 'host' ? 'RatingTester' : 'RatingFriend', '--width', '960', '--height', '720'
            systemProperty 'socialrating.smoke.shared', ratingShared
            systemProperty 'socialrating.smoke.port', ratingPort
            systemProperty 'socialrating.smoke.guest', ratingRole == 'guest' ? 'true' : 'false'
            if (ratingRole == 'guest') args '--quickPlayMultiplayer', '127.0.0.1:' + ratingPort
        }
    }
    afterEvaluate {
        def combined = tasks.register('ratingSmokeJar', Jar) {
            dependsOn tasks.named('classes'), tasks.named('smokeClasses')
            archiveFileName = 'social-rating-forge-smoke.jar'
            destinationDirectory = layout.buildDirectory.dir('smoke-runtime')
            from sourceSets.main.output
            manifest { attributes 'MixinConfigs': 'socialrating.mixins.json' }
            setExcludes([])
        }
        tasks.named('runClient') {
            dependsOn combined
            setWorkingDir(ratingRun)
            def excluded = (sourceSets.main.output.files + sourceSets.smoke.output.files) as Set
            setClasspath(classpath.filter { !excluded.contains(it) })
            doFirst {
                copy {
                    from combined.get().archiveFile
                    into new File(ratingRun, 'mods')
                }
            }
        }
    }
    tasks.named('processResources') {
        doLast {
            new File(destinationDir, 'META-INF/mods.toml').append('\n[[mods]]\nmodId="socialrating_smoke"\nversion="1.0.0"\ndisplayName="Social Rating verification"\n')
        }
    }
}

// Verify server data behavior against this Minecraft version's bundled libraries.
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}
tasks.named('compileTestJava', JavaCompile) {
    sourceCompatibility = '25'
    targetCompatibility = '25'
    options.release = 25
}
tasks.named('test') { enabled = false }
['RatingStore', 'ServerFiles', 'RatingFeatures'].each { suite ->
    tasks.register('verify' + suite, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'dev.eyecrasher.socialrating.' + suite + 'Test'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    }
}
tasks.named('check') { dependsOn 'verifyRatingStore', 'verifyServerFiles', 'verifyRatingFeatures' }
