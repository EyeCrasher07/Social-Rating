plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }

java { toolchain.languageVersion = JavaLanguageVersion.of(25) }
neoForge { version = '26.3.0.86'
mods { socialrating { sourceSet(sourceSets.main) } }
    runs { server { server(); gameDirectory = file('build/run/server'); programArgument '--nogui' } }
}
repositories { mavenCentral() }

version = '1.0.0'
group = 'dev.eyecrasher.socialrating'
base { archivesName = 'social-rating-neoforge' }
tasks.withType(org.gradle.api.tasks.bundling.AbstractArchiveTask).configureEach { archiveVersion = project.version.toString() + '+26.3' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
configurations.matching {
    it.name.endsWith('CompileClasspath') || it.name.endsWith('RuntimeClasspath') ||
        it.name in ['compileClasspath', 'runtimeClasspath']
}.configureEach {
    attributes.attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 25)
}
jar {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest { attributes 'MixinConfigs': 'socialrating.mixins.json' }
    from(file('LICENSE')) { rename { 'LICENSE_social-rating.txt' } }
}

// Isolated two-client verification; excluded from the distributable JAR.
tasks.named('processResources') { inputs.property 'socialRatingSmoke', project.hasProperty('smokeTest') }
tasks.withType(Jar).configureEach { exclude '**/RatingSmoke*.class' }
if (project.hasProperty('smokeTest')) {
    sourceSets {
        smoke {
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath
            resources.exclude 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml'
        }
    }
    def ratingRole = project.findProperty('smokeRole') ?: 'host'
    def ratingPort = project.findProperty('smokePort') ?: '25593'
    def ratingRun = file('run/smoke-pair/' + ratingRole)
    def ratingShared = file('run/smoke-pair').absolutePath
    neoForge {
        mods { socialrating { sourceSet(sourceSets.smoke) } }
        runs {
            client {
                client()
                gameDirectory = ratingRun
                programArguments.addAll('--username', ratingRole == 'host' ? 'RatingTester' : 'RatingFriend', '--width', '960', '--height', '720')
                systemProperty 'socialrating.smoke.shared', ratingShared
                systemProperty 'socialrating.smoke.port', ratingPort
                systemProperty 'socialrating.smoke.guest', ratingRole == 'guest' ? 'true' : 'false'
                if (ratingRole == 'guest') programArguments.addAll('--quickPlayMultiplayer', '127.0.0.1:' + ratingPort)
            }
        }
    }
    tasks.named('processResources') {
        doLast {
            new File(destinationDir, 'META-INF/neoforge.mods.toml').append('\n[[mods]]\nmodId="socialrating_smoke"\nversion="1.0.0"\ndisplayName="Social Rating verification"\n')
        }
    }
}

// Verify server data behavior against this Minecraft version's bundled libraries.
sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.runtimeClasspath
}
tasks.named('compileTestJava', JavaCompile) {
    sourceCompatibility = '25'
    targetCompatibility = '25'
    options.release = 25
}
tasks.named('test') { enabled = false }
['RatingStore', 'ServerFiles', 'RatingFeatures'].each { suite ->
    tasks.register('verify' + suite, JavaExec) {
        dependsOn tasks.named('testClasses')
        classpath = sourceSets.test.runtimeClasspath
        mainClass = 'dev.eyecrasher.socialrating.' + suite + 'Test'
        javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    }
}
tasks.named('check') { dependsOn 'verifyRatingStore', 'verifyServerFiles', 'verifyRatingFeatures' }
